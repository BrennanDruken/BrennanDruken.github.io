    <h1 style="text-align: center;">Orbital Eccentricity</h1>
    <hr>
    <p>Orbital eccentricity is a measure of how much the orbit of a celestial body deviates from a perfect circle. A value of 0 is a circular orbit. Values between 0 and 1 indicate an elliptic orbit. 1 is a parabolic <abbr title="An escape orbit is a trajectory where a celestial body has exactly enough energy to break free from the gravity of another celestial body.">(escape)</abbr> orbit.</p>
