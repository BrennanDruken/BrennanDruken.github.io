    <h1 style="text-align: center;">Rogue Planet</h1>
    <hr>
    <p>A <abbr title="Also called a free-floating planet.">rogue planet</abbr> is a planet that is not gravitationally bound to a star or brown dwarf. Some rogue planets likely form in a solar system, but later were ejected from their stars orbit. They can also form on their own.</p>
